spring.application.name=iconverter

# Framework cap = the largest per-endpoint limit (audio/video = 50 MB). Other
# controllers enforce their own stricter 25 MB check and return 400 themselves.
# Oversized uploads beyond this cap are rejected by the framework
# (MaxUploadSizeExceededException → 400).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

app.temp-dir=/tmp/iconverter

# SQLite-backed persistence (error log; contact messages will share this file).
spring.datasource.url=jdbc:sqlite:./data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# How long error_log rows are kept before the daily cleanup job deletes them.
app.error-log.retention-days=30
# Per-IP cap on error_log writes/minute — independent of the general API
# rate limit, which allows the same request rate whether it succeeds or fails.
app.error-log.rate-limit-per-minute=20

# Per-IP rate limit on /api/** (requests per minute). Conversions are heavy
# external processes, so cap each client to protect CPU/memory.
app.rate-limit.per-minute=60

# Virtual-memory cap (ulimit -v, MB) for ffmpeg/ebook-convert child processes.
# The backend container itself is limited to ~1.9GB with the JVM heap alone
# taking up to 75% of that — this bounds runaway conversions so they fail on
# their own instead of risking the kernel OOM killer hitting the JVM instead.
app.process.memory-limit-mb=1200

logging.level.root=INFO
logging.level.com.yourpackage=DEBUG
logging.level.org.springframework.web=DEBUG

logging.file.name=application.log
logging.file.path=./logs

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
