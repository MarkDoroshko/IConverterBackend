# Local dev/test compose. Builds the image from this directory.
# Production server uses /opt/iconverter/backend/docker-compose.yml which
# pulls a pre-built image from ghcr.io.
services:
  backend:
    build: .
    image: iconverter-backend:local
    container_name: iconverter-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    # The converter parses untrusted files. Keep the image read-only and give
    # it only a scratch /tmp; no new privileges, no Linux capabilities, bounded
    # processes/memory/CPU.
    read_only: true
    tmpfs:
      # exec is needed: sqlite-jdbc extracts a native .so into /tmp and dlopen
      # fails on a noexec mount; numba also writes its JIT cache there.
      - /tmp:size=768m,mode=1777,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - NUMBA_CACHE_DIR=/tmp
